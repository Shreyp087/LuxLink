name: Feature request
description: Propose a user outcome, not only an implementation.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, in what context, and how is it handled today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing internals.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and failure modes
      description: Consider offline use, weak cameras, glare, accessibility, security, and compatibility.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or validation plan
      description: Link research or explain the test that would validate the need.
  - type: checkboxes
    id: definition
    attributes:
      label: Definition
      options:
        - label: I can describe how we would know this feature works.
          required: true
